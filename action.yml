name: Exevra Test Integrity
description: Detect missing or changed JUnit test execution in CI.
inputs:
  config:
    description: Path to Exevra config
    required: false
    default: .exevra.yml
  mode:
    description: Whether findings block the Action
    required: false
    default: enforce
runs:
  using: node24
  main: dist/index.js
branding:
  icon: shield
  color: purple
