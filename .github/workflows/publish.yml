name: Publish npm package

on:
  push:
    branches: [main]
    paths:
      - package.json
      - package-lock.json

concurrency:
  group: npm-publish
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.14.0
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: npm install --global npm@11.5.1
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run verify:bundle
      - name: Verify Vitest integration
        uses: ./.github/actions/node-integration
        with:
          fixture: test/fixtures/node/vitest
          init_mode: auto
      - name: Verify Jest integration
        uses: ./.github/actions/node-integration
        with:
          fixture: test/fixtures/node/jest
          init_mode: explicit
      - name: Verify Playwright integration
        uses: ./.github/actions/node-integration
        with:
          fixture: test/fixtures/node/playwright
          init_mode: explicit
      - name: Verify packed npm package
        run: |
          package_dir="$(mktemp -d)"
          npm pack --ignore-scripts --pack-destination "$package_dir"
          package_tarball="$(find "$package_dir" -maxdepth 1 -name '*.tgz' -print -quit)"
          test -n "$package_tarball"
          consumer_dir="$(mktemp -d)"
          npm install --prefix "$consumer_dir" --no-save --ignore-scripts --no-audit --no-fund "$package_tarball"
          "$consumer_dir/node_modules/.bin/exevra" --help
      - id: package
        run: |
          package_name="$(node -p "require('./package.json').name")"
          package_version="$(node -p "require('./package.json').version")"
          if npm view "${package_name}@${package_version}" version >/dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.package.outputs.published != 'true'
        run: npm publish
