name: Matrix aggregation fixture

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    strategy:
      matrix:
        shard: [unit-jdk17, unit-jdk21]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: exevra-${{ matrix.shard }}
          path: test/fixtures/aggregation/artifacts/shards/${{ matrix.shard }}/target/surefire-reports
  collect:
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: cp test/fixtures/aggregation/.exevra.yml .exevra.yml && mkdir -p .exevra && cp test/fixtures/aggregation/.exevra/baseline.json .exevra/baseline.json
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: exevra-unit-jdk17
          path: artifacts/shards/unit-jdk17/target/surefire-reports
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: exevra-unit-jdk21
          path: artifacts/shards/unit-jdk21/target/surefire-reports
      - run: node build/src/cli/index.js aggregate --config .exevra.yml --format github-actions
      - run: rm -rf artifacts/shards/unit-jdk21
      - run: |
          if node build/src/cli/index.js aggregate --config .exevra.yml > aggregate-missing.log 2>&1; then
            cat aggregate-missing.log
            exit 1
          fi
          grep -q SHARD_MISSING aggregate-missing.log
