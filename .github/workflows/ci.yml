name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Check execution integrity
        shell: bash
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            node build/src/cli/index.js check --base-ref "$EXEVRA_BASE_REF" --format github-actions
          else
            node build/src/cli/index.js check --format github-actions
          fi
        env:
          EXEVRA_BASE_REF: ${{ github.event.pull_request.base.sha }}
      - run: npm run test:coverage
      - run: npm run typecheck
      - run: npm run verify:bundle
  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: website/package-lock.json
      - run: npm run docs:check
  node-integration:
    timeout-minutes: 15
    strategy:
      matrix:
        include:
          - path: test/fixtures/node/vitest
            init_mode: auto
          - path: test/fixtures/node/jest
            init_mode: explicit
          - path: test/fixtures/node/playwright
            init_mode: explicit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - run: npm ci
      - run: npm run build
      - uses: ./.github/actions/node-integration
        with:
          fixture: ${{ matrix.path }}
          init_mode: ${{ matrix.init_mode }}
